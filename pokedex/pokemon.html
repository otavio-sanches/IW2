<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Consulta Pokémon</title>
</head>

<body>

    <main class="container">
        <h1>Pokédex</h1>

        <div class="busca">
            <input type="number" id="numero" placeholder="Número da Pokédex" min="1" max="1025">
            <button onclick="callApi()">
                Buscar
            </button>
        </div>

        <div class="resultado">
            <img id="imagem" src="" alt="">
            <p id="nome"></p>
        </div>



    </main>

    <script src="main.js"></script>
</body>

</html>
